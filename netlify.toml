# Netlify configuration for sandhillstorage.com
#
# NOTE: this site also has a `_redirects` file holding the apex->www rule, the
# legacy IdeaTek /pages/* rules, and the clean-URL 200 rewrites. Netlify
# processes redirects declared HERE first, then falls through to `_redirects`.
# Never add a `/blog/*` or `/locations/*` wildcard here — it would shadow the
# 200 rewrites in `_redirects` and take the live pages down.

# --- Retire the old IdeaTek domain -------------------------------------------
# Lives at the TOP of `_redirects`, not here. A forced domain-level 301 in this
# file loses to the clean-URL `200` rewrites in `_redirects`, so /faq and the
# location and blog pages kept serving on the old domain. Putting it above
# those rewrites in the same file is what actually works.

# --- Dead IdeaTek blog URLs --------------------------------------------------
# The old site's blog didn't carry over. GA4 (last 90d) shows ~96 pageviews
# still landing on these slugs from search results and old links. Point each at
# the closest surviving post, or at the blog index where nothing matches.
# Listed individually and case-exact, matching what GA4 actually recorded.

[[redirects]]
  from = "/blog/Climate-controlled-storage"
  to = "/blog/climate-vs-drive-up"
  status = 301

[[redirects]]
  from = "/blog/prepareforstorm"
  to = "/blog/kansas-weather-protection"
  status = 301

[[redirects]]
