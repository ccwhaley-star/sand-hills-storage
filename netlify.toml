# --- Missing locations index -------------------------------------------------
# There are four location pages but no /locations index; GA4 shows people
# landing on the bare path. Send them to the homepage locations section.
[[redirects]]
  from = "/locations"
  to = "/#locations"
  status = 301

[[redirects]]
  from = "/locations/"
  to = "/#locations"
  status = 301

