<!DOCTYPE html>

<head>

<style>
  .nf {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 60px 24px;
    background: linear-gradient(135deg, #F5F7FA 0%, #E8F1FA 100%);

  }
  .nf .mark { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
  .nf .mark img { height: 52px; width: auto; }
  .nf .mark .wordmark { display: flex; flex-direction: column; line-height: 1; font-weight: 700; }
  .nf .mark .wordmark .name { font-size: 1.4rem; }
  .nf .mark .wordmark .name .gray { color: var(--gray-dark); }
  .nf .mark .wordmark .name .blue { color: var(--blue); }
  .nf .mark .wordmark .sub { font-size: 0.7rem; letter-spacing: 0.32em; color: var(--gray); font-weight: 500; margin-top: 4px; text-align: center; padding-left: 0.32em; }
  .nf .code {
    font-size: 0.85rem; font-weight: 600; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--ochre-dark);
    margin-bottom: 12px;
  }
  .nf h1 { font-size: clamp(1.8rem, 4vw, 2.4rem); margin-bottom: 12px; }
  .nf p { color: var(--gray-warm); max-width: 480px; margin: 0 auto 28px; }
  .nf .links { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
</style>

<main class="nf">
  <a class="mark" href="/" aria-label="Sand Hills Storage home">

  </div>
